name: Validate training pipeline
on: [push, pull_request]
permissions:
  contents: read
jobs:
  synthetic-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - uses: astral-sh/setup-uv@v6
      - run: npm ci
      - run: uv sync --locked
      - run: uv run --locked python scripts/validate_knowledge.py
      - run: uv run --locked python scripts/check-vendor.py
      - run: uv run --locked python -m unittest discover -s scripts -p 'test_*.py'
      - run: npm run typecheck
      - run: uv run --locked python scripts/make-synthetic-inputs.py data/smoke-inputs
      - run: >-
          uv run --locked python scripts/train.py
          --snapshot data/smoke-inputs/biometrics.db
          --watch-export data/smoke-inputs/export.zip
          --side left --timezone UTC --out data/smoke-run
