name: Validate training pipeline
on: [push, pull_request]
permissions:
  contents: read
jobs:
  synthetic-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - uses: astral-sh/setup-uv@v6
      - run: npm ci
      - run: uv sync --locked
      - run: uv run --locked python scripts/validate_knowledge.py
      - run: uv run --locked python scripts/check-vendor.py
      - run: uv run --locked python -m unittest discover -s scripts -p 'test_*.py'
      - run: npm run typecheck
      - run: node --check scripts/ui/dashboard.js
      - run: node --test scripts/test-dashboard.mjs
      - run: uv run --locked python scripts/make-synthetic-inputs.py data/smoke-inputs
      - run: >-
          uv run --locked python scripts/train.py
          --snapshot data/smoke-inputs/biometrics.db
          --watch-export data/smoke-inputs/export.zip
          --side left --timezone UTC --out data/smoke-run
      - run: >-
          uv run --locked python scripts/smoke-pod.py
          data/smoke-inputs data/smoke-run/features.json data/pod-smoke-run
      - run: >-
          uv run --locked python scripts/make-synthetic-inputs.py data/smoke-graph
          --nights 12 --replay data/smoke-graph/replay
      - run: >-
          uv run --locked python scripts/derive_snapshot.py derive data/smoke-graph/biometrics.db
          --replay data/smoke-graph/replay --cache data/smoke-graph/cache
          --out data/smoke-graph/derived/biometrics.db
      - run: uv run --locked python scripts/parse-watch-export.py data/smoke-graph/export.zip data/smoke-graph/watch.json
      - run: >-
          npm run features -- data/smoke-graph/derived/biometrics.db data/smoke-graph/watch.json
          data/smoke-graph/features.json left UTC podContext
      - run: >-
          uv run --locked python scripts/stage-backtest.py data/smoke-graph/features.json
          --snapshot data/smoke-graph/derived/biometrics.db --out data/smoke-graph/backtest
